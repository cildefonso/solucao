# Cópia local da lista de artefatos esperados em _solucao_sdd/.
# Fonte canônica: templates/migration/expected_legacy_artifacts.yaml
# Esta cópia é instalada junto com o agente para acesso direto dentro do projeto do usuário.

schemaVersion: 1
artifacts:
  - path: "analise-codigo.md"
    kind: code_analysis
    required: true
    minSchemaVersion: 1
  - path: "dominio.md"
    kind: domain_model
    required: true
    minSchemaVersion: 1
  - path: "arquitetura.md"
    kind: architecture
    required: true
    minSchemaVersion: 1
  - path: "dependencias.md"
    kind: dependencies
    required: true
    minSchemaVersion: 1
  - path: "inventario.md"
    kind: legacy_inventario
    required: true
    minSchemaVersion: 1
  - path: "dicionario-dados.md"
    kind: data_dictionary
    required: false
    minSchemaVersion: 1
  - path: "maquina-estado.md"
    kind: state_machines
    required: false
    minSchemaVersion: 1
  - path: "permissions.md"
    kind: permissions
    required: false
    minSchemaVersion: 1
  - path: "lacunas.md"
    kind: gaps
    required: true
    minSchemaVersion: 1
  - path: "duvidas.md"
    kind: questions
    required: false
    minSchemaVersion: 1
  - path: "confidence-report.md"
    kind: confidence_report
    required: true
    minSchemaVersion: 1
  - path: "traceability/code-spec-matrix.md"
    kind: code_spec_matrix
    required: false
    minSchemaVersion: 1
  - path: "sdd"
    kind: sdd_dir
    required: false
    minSchemaVersion: 1

aliases:
  "dominio.md":
    - "domain_model.md"
  "arquitetura.md":
    - "architecture_legacy.md"
  "analise-codigo.md":
    - "code_analysis.md"
    - "process_flows.md"
  "inventario.md":
    - "legacy_inventario.md"
