# Diretórios varridos pelo Publisher em auto-discovery de HTMLs auxiliares.
# HTMLs encontrados precisam ter <meta name="solucao-category" content="..."> para serem indexados.

scan_roots:
  - path: "_solucao_sdd/"
    description: "Specs SDD e outputs dos agentes de Descoberta e Migração."
  - path: ".solucao/"
    description: "Artefatos transversais do core."
    exclude:
      - "_solucao_docs/"
      - ".solucao/_config/"
      - ".solucao/context/"

categories:
  - id: review
    label: "Code Reviews"
    description: "Annotated PRs gerados pelo solucao-reviewer e similares."
  - id: design-system
    label: "Design System"
    description: "Living Design System do solucao-design-system."
  - id: diagram
    label: "Diagramas"
    description: "Annotated Flowcharts e arquiteturas adicionais."

limits:
  max_depth: 6
  timeout_seconds: 10
