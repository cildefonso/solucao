# Lista declarativa de artefatos esperados em _solucao_sdd/ antes de iniciar a migração.
# Atualizar esta lista é uma mudança de configuração; não exige reedição do agente solucao-migrar.
#
# Cada entrada:
#   path: caminho relativo dentro de _solucao_sdd/
#   kind: identificador lógico do artefato (informativo, não estritamente validado contra front-matter)
#   required: true bloqueia o pipeline se ausente; false apenas loga aviso
#   minSchemaVersion: versão mínima esperada de schemaVersion (informativo; ausência tolerada hoje)

schemaVersion: 1
artifacts:
  - path: "analise-codigo.md"
    kind: code_analysis
    required: true
    minSchemaVersion: 1
  - path: "dominio.md"
    kind: domain_model
    required: true
    minSchemaVersion: 1
  - path: "arquitetura.md"
    kind: architecture
    required: true
    minSchemaVersion: 1
  - path: "dependencias.md"
    kind: dependencies
    required: true
    minSchemaVersion: 1
  - path: "inventario.md"
    kind: legacy_inventario
    required: true
    minSchemaVersion: 1
  - path: "dicionario-dados.md"
    kind: data_dictionary
    required: false
    minSchemaVersion: 1
  - path: "maquina-estado.md"
    kind: state_machines
    required: false
    minSchemaVersion: 1
  - path: "permissions.md"
    kind: permissions
    required: false
    minSchemaVersion: 1
  - path: "lacunas.md"
    kind: gaps
    required: true
    minSchemaVersion: 1
  - path: "duvidas.md"
    kind: questions
    required: false
    minSchemaVersion: 1
  - path: "confidence-report.md"
    kind: confidence_report
    required: true
    minSchemaVersion: 1
  - path: "traceability/code-spec-matrix.md"
    kind: code_spec_matrix
    required: false
    minSchemaVersion: 1
  - path: "sdd"
    kind: sdd_dir
    required: false
    minSchemaVersion: 1

# Aliases:
# Nomes legados aceitos para compatibilidade com versões anteriores do time de descoberta.
# Cada alias mapeia "nome esperado" → lista de nomes alternativos aceitos.
aliases:
  "dominio.md":
    - "domain_model.md"
  "arquitetura.md":
    - "architecture_legacy.md"
  "analise-codigo.md":
    - "code_analysis.md"
    - "process_flows.md"
  "inventario.md":
    - "legacy_inventario.md"
